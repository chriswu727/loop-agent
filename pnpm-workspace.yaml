packages:
  - 'apps/web'
  - 'apps/desktop'
  - 'packages/*'

hoistPattern:
  - '*'

peerDependencyRules:
  allowedVersions:
    '@electron/fuses': '2'

overrides:
  '@electron/rebuild': '4.2.0'
  'brace-expansion@<1.1.21': '1.1.21'
  'brace-expansion@>=3.0.0 <5.0.12': '5.0.12'
  esbuild: '0.28.1'
  postcss: '8.5.23'
  sharp: '0.35.5'
  tmp: '0.2.7'
  'js-yaml@>=4.0.0 <4.3.2': '4.3.2'
  'browserslist@<4.28.7': '4.28.7'
  'baseline-browser-mapping@<2.11.0': '2.11.0'
  'source-map-js@<1.2.2': '1.2.2'
  'minimatch@>=7.0.0 <11.0.1': '11.0.1'

allowBuilds:
  electron-winstaller: true
  esbuild: true
  sharp: true
  unrs-resolver: true
